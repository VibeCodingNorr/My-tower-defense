name: Native GDExtension build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug --parallel 2
      - name: Download Godot 4.7.2 (Linux scene check)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot-4.7.2.zip
          unzip -q /tmp/godot-4.7.2.zip -d /tmp/wintertd-godot
          chmod +x /tmp/wintertd-godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Validate Godot scene and extension (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          GODOT=/tmp/wintertd-godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path project --editor --import --quit
          "$GODOT" --headless --path project --quit-after 5
          "$GODOT" --headless --path project --script res://tests/test_creep_preview.gd
      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: wintertd-native-${{ runner.os }}
          path: |
            project/bin/*.dll
            project/bin/*.so
          if-no-files-found: error
